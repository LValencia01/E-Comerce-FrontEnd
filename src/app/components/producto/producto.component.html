<div class="container-fluid dark-theme py-4">
    <div class="row mb-4">
      <div class="col text-center">
        <h2 class="text-dark bg-light p-3 rounded-3 shadow">Listado de Producto</h2>
      </div>
    </div>
    
      <div class="table-responsive">
        <table class="table table-dark table-striped table-hover">
          <thead class="thead-dark">
            <tr>
              <th scope="col">ID</th>
              <th scope="col">Nombre</th>
              <th scope="col">Descripcion</th>
              <th scope="col">Precio</th>
              <th scope="col">Stock</th>
              <th scope="col">Acciones</th>
          
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let producto of productos">
              <th scope="row">{{ producto.idProducto || 'N/A' }}</th>
              <td>{{ producto.nombre }}</td> 
              <td>{{ producto.descripcion }}</td>
              <td>{{ producto.precio }}</td>
              <td>{{ producto.stock }}</td>
              <td>
                <button class="btn btn-sm btn-outline-warning me-2">Editar</button>
                <button class="btn btn-sm btn-outline-danger">Eliminar</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    
      <div class="d-flex justify-content-center mt-3">
        <button class="btn btn-dark">
          <i class="bi bi-plus-circle me-2"></i>Agregar Producto
        </button>
      </div>
    </div>
