<div class="container-fluid dark-theme py-4">
  <div class="row mb-4">
    <div class="col text-center">
      <h2 class="text-dark bg-light p-3 rounded-3 shadow">Listado de Clientes</h2>
    </div>
  </div>

  <div class="d-flex justify-content-end mb-3">
    <button class="btn btn-dark" (click)="openModal()">
      <i class="bi bi-plus-circle me-2"></i>Agregar Cliente
    </button>
  </div>

  <div class="table-responsive">
    <table class="table table-dark table-striped table-hover">
      <thead class="thead-dark">
        <tr>
          <th scope="col">ID</th>
          <th scope="col">Nombre</th>
          <th scope="col">Apellido</th>
          <th scope="col">Email</th>
          <th scope="col">Teléfono</th>
          <th scope="col">Dirección</th>
          <th scope="col">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let cliente of clientes">
          <th scope="row">{{ cliente.idCliente || 'N/A' }}</th>
          <td>{{ cliente.nombre }}</td>
          <td>{{ cliente.apellido }}</td>
          <td>{{ cliente.eMail }}</td>
          <td>{{ cliente.telefono }}</td>
          <td>{{ cliente.direccion }}</td>
          <td>
            <button class="btn btn-sm btn-outline-warning me-2" (click)="editCliente(cliente)">
              <i class="fa fa-edit"></i>Editar
            </button>
            <button class="btn btn-sm btn-outline-danger" (click)="cliente.idCliente ? deleteCliente(cliente.idCliente) : null">
              <i class="fa fa-trash"></i>Eliminar
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="modal" tabindex="-1" [ngStyle]="{'display': showModal ? 'block' : 'none'}">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">{{ modalTitle }}</h5>
          <button type="button" class="btn-close" (click)="closeModal()"></button>
        </div>
        <div class="modal-body">
          <form [formGroup]="clienteForm" (ngSubmit)="onSubmit()">
            <input type="hidden" formControlName="idCliente" />
            <div class="mb-3">
              <label for="nombre" class="form-label">Nombre</label>
              <input type="text" class="form-control" id="nombre" formControlName="nombre" required />
            </div>
            <div class="mb-3">
              <label for="apellido" class="form-label">Apellido</label>
              <input type="text" class="form-control" id="apellido" formControlName="apellido" required />
            </div>
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input type="email" class="form-control" id="email" formControlName="email" required />
            </div>
            <div class="mb-3">
              <label for="telefono" class="form-label">Teléfono</label>
              <input type="text" class="form-control" id="telefono" formControlName="telefono" required />
            </div>
            <div class="mb-3">
              <label for="direccion" class="form-label">Dirección</label>
              <input type="text" class="form-control" id="direccion" formControlName="direccion" required />
            </div>
            <button type="submit" class="btn btn-primary" [disabled]="clienteForm.invalid">Guardar</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
